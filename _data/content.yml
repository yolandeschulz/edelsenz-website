  line1: "Essential Solutions."
  line2: "Exceptional Results."
  lead: "A South African technical ingredient and innovation partner, connecting global &amp; local sourcing, functional formulation and finished-product manufacturing into one integrated solution. We take ideas from concept to counter."
  cta1: "Explore our divisions"
  cta2: "How we work"
  stat1_label: "Years of experience"
