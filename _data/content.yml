story:
  eyebrow: "Our story"
  h2: ""
  h2a: "Built to make a"
  h2b: "difference"
  h2c: "in food"
  p1: "EdelSenz began with a long-held dream. After 18 years in corporate leadership roles across Europe, the Middle East and Africa, founder <strong>Yolande Schulz</strong> set out to build a business that could make a real difference in FMCG."
  p2: "Formed in 2025, EdelSenz brought together shareholders and experts with one shared goal: making a real difference in food in Africa. That ambition still sits at our core."
  edel: "From Edelweiss, honouring our founders&rsquo; European roots."
  senz: "From African roots, built and grounded in South Africa."
quote:
  text: "We know what it takes to operate at a global standard while staying locally relevant."
  attr: "Yolande Schulz"
  name: "Yolande Schulz"
  role: "Managing Director"
vm:
  eyebrow: "Where we&rsquo;re going"
  h2: ""
  h2a: "Vision &amp;"
  h2b: "mission"
  vision: "To be the trusted innovation partner for food, beverage and personal-care businesses, helping customers move from idea to shelf."
  mission: "To deliver science-backed nutritional and functional solutions that improve public health and support traceable supply chains."
values:
  eyebrow: "What we stand for"
  h2: ""
  h2a: "Our core"
  h2b: "values"
  intro: "Six principles that guide how we work, every day."
  v1_title: "Own it"
  v1_text: "We take responsibility for what we commit to. We follow up, close the loop and ask for help early."
  v2_title: "Do the right thing"
  v2_text: "We choose integrity and honesty, and we never over-promise."
  v3_title: "Stay science-backed"
  v3_text: "We respect technical quality, evidence and regulatory awareness."
  v4_title: "Build practical solutions"
  v4_text: "We focus on solutions customers can actually use, tied to real cost and supply."
  v5_title: "Work as one team"
  v5_text: "We share, collaborate across divisions and partners, and never build silos."
  v6_title: "Grow responsibly"
  v6_text: "We grow at the right pace, protecting EdelSenz, our partners and our customers."
video:
  eyebrow: "Idea to shelf"
  h2: "One integrated journey"
  sub: "From farming and milling to development and manufacturing, it all comes together at EdelSenz."
divisions:
  eyebrow: "Our group"
  h2: ""
  h2a: "Six"
  h2b: "specialised"
  h2c: "divisions"
  intro: "Deep, category expertise across food and personal care, backed by one integrated team."
  d1_desc: "Speciality, not commodity. We source new ingredients and products through trusted networks, locally and globally."
  d2_desc: "As the <strong>sole distributor of Akay</strong>, we bring world-class spice extracts and oleoresins to local manufacturers, plus technical seasoning and custom flavour systems."
  d3_desc: "Heritage milling and modern bakery solutions, plus vitamin &amp; mineral premix blends for fortification."
  d4_desc: "Natural skincare, body and home ranges, formulated and manufactured under one roof."
  d5_desc: "Farm-to-shelf pantry ranges: pastas, sauces, preserves, granola, rusks and single-farm ingredients."
  d6_desc: "Functional, trend-forward beverages built on our own nutrition technologies, from protein waters to next-gen wellness drinks."
sustainability:
  eyebrow: "Sustainability"
  h2: "Sourced responsibly. Nothing wasted."
  intro: "Sustainability shapes how we source and how we make. We build traceable supply chains and upcycle by-products into valuable ingredients instead of waste."
  s1_title: "Responsible sourcing"
  s1_text: "Traceable supply chains that prioritise local farmers and suppliers."
  s2_title: "Upcycled by-products"
  s2_text: "We turn side-streams that would otherwise be discarded into functional ingredients."
  s3_title: "Less waste, more value"
  s3_text: "Circular thinking from raw material to final SKU, cutting waste and adding value."
people:
  eyebrow: "Our people &amp; communities"
  h2: ""
  h2a: "The power is in our"
  h2b: "people"
  intro: "EdelSenz is built by people, for the communities we serve. Our team turns ideas into real products, from the kitchen to the farm."
hope:
  eyebrow: "Enriching Lives"
  h2: "EdelSenz Hope"
  intro: "EdelSenz Hope is how we give back to our communities and our profession, through real jobs, food security and shared expertise."
  h1_title: "Jobs that empower women"
  h1_text: "We employ women from our communities, including farm workers&rsquo; wives and daughters, creating stable income where it matters most."
  h2_title: "Feeding schemes"
  h2_text: "We support feeding initiatives that put nutritious, wholesome food on more tables across our communities."
  h3_title: "Giving back to our profession"
  h3_text: "Our directors serve the wider industry. Yolande Schulz is a SAAFOST Council member and Vice President, and mentors through Partners in Food Solutions (PFS)."
